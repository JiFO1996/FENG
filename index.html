<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TED条码神器</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TED条码">
<link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f4e6.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a73e8">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;color:#333;min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#1a73e8,#0d47a1);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:#fff;border-radius:16px;padding:40px 32px;width:90%;max-width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-box .lock-icon{font-size:48px;margin-bottom:16px}
.login-box h2{font-size:20px;color:#333;margin-bottom:8px}
.login-box p{font-size:13px;color:#888;margin-bottom:24px}
.login-box input{width:100%;padding:12px 16px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;text-align:center;letter-spacing:4px;transition:border-color .2s}
.login-box input:focus{outline:none;border-color:#1a73e8}
.login-box .login-btn{width:100%;margin-top:16px;padding:12px;border:none;border-radius:10px;background:#1a73e8;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s}
.login-box .login-btn:hover{background:#1557b0}
.login-box .error-msg{color:#ea4335;font-size:13px;margin-top:12px;min-height:20px}
.app-content{display:none}
.app-content.visible{display:block}
.header{background:linear-gradient(135deg,#1a73e8,#0d47a1);color:#fff;padding:20px 30px;box-shadow:0 2px 8px rgba(0,0,0,.15);padding-top:max(20px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:24px;font-weight:600}
.header p{font-size:13px;opacity:.85;margin-top:4px}
.logout-btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer}
.container{max-width:960px;margin:24px auto;padding:0 20px}
.import-section{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:20px}
.import-section h2{font-size:16px;margin-bottom:14px;color:#1a73e8}
.import-row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.import-row textarea{flex:1;min-width:280px;height:120px;border:2px dashed #c4c4c4;border-radius:8px;padding:12px;font-size:14px;font-family:"Courier New",monospace;resize:vertical;line-height:1.6}
.import-row textarea:focus{outline:none;border-color:#1a73e8}
.btn-group{display:flex;flex-direction:column;gap:8px}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn-primary{background:#1a73e8;color:#fff}
.btn-secondary{background:#e8eaed;color:#333}
.btn-success{background:#0f9d58;color:#fff}
.btn-danger{background:#ea4335;color:#fff}
.stats{margin-top:12px;font-size:13px;color:#666}
.stats span{font-weight:600;color:#1a73e8}
.control-bar{background:#fff;border-radius:12px;padding:16px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.control-bar label{font-size:14px;color:#555}
.control-bar input[type="number"]{width:70px;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:14px;text-align:center}
.progress-info{margin-left:auto;font-size:14px;color:#555}
.progress-info strong{color:#1a73e8;font-size:18px}
.barcode-display{background:#fff;border-radius:12px;padding:40px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.barcode-display.empty{color:#aaa;font-size:16px}
.barcode-display.empty .icon{font-size:64px;margin-bottom:16px}
.barcode-wrapper{padding:20px;background:#fff;border-radius:8px}
.barcode-wrapper svg{max-width:100%;height:auto}
.tracking-number{font-size:28px;font-weight:700;font-family:"Courier New",monospace;color:#222;margin-top:16px;letter-spacing:2px}
.auto-badge{position:absolute;top:16px;right:16px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.auto-badge.running{background:#e6f4ea;color:#0f9d58;animation:pulse 1.5s infinite}
.auto-badge.paused{background:#fef7e0;color:#f9ab00}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.progress-bar-container{width:100%;height:4px;background:#e8eaed;border-radius:2px;margin-top:20px;overflow:hidden}
.progress-bar-fill{height:100%;background:#1a73e8;border-radius:2px;transition:width .3s ease}
.list-section{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-top:20px}
.list-section h3{font-size:15px;color:#555;margin-bottom:12px}
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;max-height:300px;overflow-y:auto}
.list-item{padding:8px 12px;border-radius:6px;font-size:13px;font-family:"Courier New",monospace;cursor:pointer;transition:all .15s;border:1px solid #eee;display:flex;align-items:center;gap:8px}
.list-item:hover{background:#f0f6ff;border-color:#1a73e8}
.list-item.active{background:#e8f0fe;border-color:#1a73e8;color:#1a73e8;font-weight:600}
.list-item .idx{color:#999;font-size:11px;min-width:28px}
.shortcuts{margin-top:16px;padding:12px 16px;background:#f8f9fa;border-radius:8px;font-size:12px;color:#777;line-height:1.8}
.shortcuts kbd{background:#e8eaed;padding:2px 6px;border-radius:4px;font-family:monospace;font-size:11px;border:1px solid #ccc}
@media(max-width:600px){.import-row{flex-direction:column}.btn-group{flex-direction:row;flex-wrap:wrap}.control-bar{flex-direction:column;align-items:stretch}.progress-info{margin-left:0;text-align:center}.tracking-number{font-size:20px}}
</style>
</head>

<div class="lock-icon">🔒</div>

<div class="error-msg" id="errorMsg"></div>
</div>
</div>

       style="position:fixed; top:20px; left:20px; width:60px; height:60px; z-index:999; pointer-events:none; border-radius:8px;">  
<button class="logout-btn" onclick="doLogout()">🔒 退出登录</button>
</div>
<div class="container">
<div class="import-section">
<h2>📮 导入快递单号</h2>
<div class="import-row">
<textarea id="inputArea" placeholder="每行输入一个快递单号，例如：&#10;1228837802566&#10;8218837802586&#10;9618837802512"></textarea>
<div class="btn-group">
<button class="btn btn-primary" onclick="generateBarcodes()">生成条码</button>
<button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">从文件导入</button>
<button class="btn btn-danger" onclick="clearAll()">清空</button>
<input type="file" id="fileInput" accept=".txt,.csv,.text" style="display:none" onchange="importFile(event)">
</div>
</div>
<div class="stats" id="stats"></div>
</div>
<div class="control-bar" id="controlBar" style="display:none">
<label>切换间隔：</label>
<input type="number" id="intervalInput" value="3" min="1" max="60" onchange="updateInterval()">
<label>秒</label>
<button class="btn btn-success" id="btnPlay" onclick="toggleAutoPlay()">▶ 自动播放</button>
<button class="btn btn-secondary" onclick="prevBarcode()">⏮ 上一个</button>
<button class="btn btn-secondary" onclick="nextBarcode()">⏭ 下一个</button>
<div class="progress-info">第 <strong id="currentIdx">1</strong> / <span id="totalCount">0</span> 个</div>
</div>
<div class="barcode-display empty" id="barcodeDisplay">
<div class="icon">🦊</div>
<div>"J.FENG"</div>
</div>
<div class="list-section" id="listSection" style="display:none">
<h3>📮 单号列表（点击可跳转）</h3>
<div class="list-grid" id="listGrid"></div>
</div>
<div class="shortcuts" id="shortcuts" style="display:none">
<strong>快捷键：</strong><kbd>Space</kbd> 播放/暂停 <kbd>←</kbd> 上一个 <kbd>→</kbd> 下一个 <kbd>↑</kbd><kbd>↓</kbd> 调整间隔±1秒
</div>
</div>
</div>
<script>
// ===== 密码验证 =====
const PASSWORD_HASH = "35f6c865da33895d79c611103920f071ca602fcbbe8d7debb08fbccc3c8e6141";
async function hashPassword(pwd){
  const data=new TextEncoder().encode(pwd+"TED_BARCODE_SALT_2026");
  const buf=await crypto.subtle.digest("SHA-256",data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
(async function(){
  const s=localStorage.getItem("ted_auth");
  if(s===PASSWORD_HASH) showApp();
})();
async function doLogin(){
  const pwd=document.getElementById("passwordInput").value;
  const h=await hashPassword(pwd);
  if(h===PASSWORD_HASH){localStorage.setItem("ted_auth",PASSWORD_HASH);showApp();}
  else{document.getElementById("errorMsg").textContent="密码错误，请重试";document.getElementById("passwordInput").value="";document.getElementById("passwordInput").focus();}
}
function doLogout(){localStorage.removeItem("ted_auth");document.getElementById("appContent").classList.remove("visible");document.getElementById("loginOverlay").style.display="flex";document.getElementById("passwordInput").value="";document.getElementById("errorMsg").textContent="";}
function showApp(){document.getElementById("loginOverlay").style.display="none";document.getElementById("appContent").classList.add("visible");}

// ===== 条码生成器 =====
let barcodes=[],currentIdx=0,timer=null,isPlaying=false;
function importFile(f){const file=f.target.files[0];if(!file)return;const r=new FileReader();r.onload=function(e){document.getElementById('inputArea').value=e.target.result;};r.readAsText(file);f.target.value='';}
function generateBarcodes(){
  const text=document.getElementById('inputArea').value.trim();
  if(!text){alert('请先输入或导入快递单号！');return;}
  barcodes=text.split(/[\r\n]+/).map(l=>l.trim()).filter(l=>l.length>0);
  if(barcodes.length===0){alert('未检测到有效的快递单号！');return;}
  const unique=[],seen=new Set();
  barcodes.forEach(n=>{if(!seen.has(n)){seen.add(n);unique.push(n);}});
  barcodes=unique;currentIdx=0;
  document.getElementById('stats').innerHTML='已解析 <span>'+barcodes.length+'</span> 个快递单号（已自动去重）';
  document.getElementById('controlBar').style.display='flex';
  document.getElementById('totalCount').textContent=barcodes.length;
  document.getElementById('shortcuts').style.display='block';
  renderList();renderBarcode(currentIdx);
}
function renderList(){
  const grid=document.getElementById('listGrid');grid.innerHTML='';
  barcodes.forEach((num,i)=>{
    const div=document.createElement('div');div.className='list-item'+(i===currentIdx?' active':'');
    div.innerHTML='<span class="idx">'+(i+1)+'.</span>'+num;
    div.onclick=function(){currentIdx=i;renderBarcode(i);renderList();};
    grid.appendChild(div);
  });
  document.getElementById('listSection').style.display='block';
}
function renderBarcode(idx){
  const display=document.getElementById('barcodeDisplay');
  const num=barcodes[idx];
  display.classList.remove('empty');
  display.innerHTML='<div class="barcode-wrapper"><svg id="barcodeSvg"></svg></div><div class="tracking-number">'+num+'</div>';
  try{JsBarcode("#barcodeSvg",num,{format:"CODE128",width:2,height:100,displayValue:true,fontSize:16,margin:10});}catch(e){display.innerHTML='<div style="color:red">条码生成失败: '+num+'</div>';}
  document.getElementById('currentIdx').textContent=idx+1;
  const pct=((idx+1)/barcodes.length*100).toFixed(1);
  const old=display.querySelector('.progress-bar-container');
  if(!old){const pc=document.createElement('div');pc.className='progress-bar-container';pc.innerHTML='<div class="progress-bar-fill" style="width:'+pct+'%"></div>';display.appendChild(pc);}
  else{old.querySelector('.progress-bar-fill').style.width=pct+'%';}
  renderList();
}function nextBarcode(){currentIdx=(currentIdx+1)%barcodes.length;renderBarcode(currentIdx);}
function prevBarcode(){currentIdx=(currentIdx-1+barcodes.length)%barcodes.length;renderBarcode(currentIdx);}
function toggleAutoPlay(){
  if(isPlaying){clearInterval(timer);isPlaying=false;document.getElementById('btnPlay').textContent='▶ 自动播放';document.getElementById('btnPlay').className='btn btn-success';}
  else{const sec=parseInt(document.getElementById('intervalInput').value)||3;timer=setInterval(nextBarcode,sec*1000);isPlaying=true;document.getElementById('btnPlay').textContent='⏸ 暂停';document.getElementById('btnPlay').className='btn btn-warning';}
}
function updateInterval(){if(isPlaying){clearInterval(timer);const sec=parseInt(document.getElementById('intervalInput').value)||3;timer=setInterval(nextBarcode,sec*1000);}}
function clearAll(){
  if(isPlaying){clearInterval(timer);isPlaying=false;}
  barcodes=[];currentIdx=0;
  document.getElementById('inputArea').value='';
  document.getElementById('stats').innerHTML='';
  document.getElementById('controlBar').style.display='none';
  document.getElementById('listSection').style.display='none';
  document.getElementById('shortcuts').style.display='none';
  const display=document.getElementById('barcodeDisplay');
  display.className='barcode-display empty';
  display.innerHTML='<div class="icon">🦄</div><div>"J.FENG"</div>';
  document.getElementById('btnPlay').textContent='▶ 自动播放';
  document.getElementById('btnPlay').className='btn btn-success';
}
document.addEventListener('keydown',function(e){
  if(document.getElementById('loginOverlay').style.display!=='none'&&document.getElementById('loginOverlay').style.display!=='') return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.code==='Space'){e.preventDefault();if(barcodes.length>0)toggleAutoPlay();}
  else if(e.code==='ArrowRight'){if(barcodes.length>0)nextBarcode();}
  else if(e.code==='ArrowLeft'){if(barcodes.length>0)prevBarcode();}
  else if(e.code==='ArrowUp'){e.preventDefault();const inp=document.getElementById('intervalInput');inp.value=Math.min(60,parseInt(inp.value)+1);updateInterval();}
  else if(e.code==='ArrowDown'){e.preventDefault();const inp=document.getElementById('intervalInput');inp.value=Math.max(1,parseInt(inp.value)-1);updateInterval();}
});
</script>
</body>
</html>
